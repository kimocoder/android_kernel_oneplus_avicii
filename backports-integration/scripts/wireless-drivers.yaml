    - BACKPORTS_ATH11K
    - BACKPORTS_ATH11K_DEBUG
    - BACKPORTS_ATH11K_DEBUGFS
    kernel_max_version: null
    kernel_min_version: '4.19'
    module_names:
    - ath11k
    - ath11k_pci
    name: ath11k
    performance_notes: Optimized for 802.11ax features including OFDMA and MU-MIMO
    security_notes: Supports WPA3, SAE, and OWE protocols
    supported_chipsets:
    - QCA6390
