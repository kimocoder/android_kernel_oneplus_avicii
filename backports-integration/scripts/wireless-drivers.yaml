drivers:
  ath10k:
    android_compatible: true
    capabilities:
    - dfs_support
    - packet_injection
    - monitor_mode
    - hardware_crypto
    - power_management
    - mesh_networking
    - spectral_scan
    dependencies:
    - mac80211
    - cfg80211
    - crypto
    description: Qualcomm Atheros 11ac wireless driver
    driver_family: ath
    kconfig_options:
    - BACKPORTS_ATH10K
    - BACKPORTS_ATH10K_DEBUG
    - BACKPORTS_ATH10K_DEBUGFS
    kernel_max_version: null
    kernel_min_version: '3.10'
    module_names:
    - ath10k_core
    - ath10k_pci
    name: ath10k
    performance_notes: Mature 802.11ac implementation with good stability
    security_notes: Supports WPA2 and basic WPA3 features
    supported_chipsets:
    - QCA988X
    - QCA6174
    vendor: Qualcomm
  ath11k:
    android_compatible: true
    capabilities:
    - dfs_support
    - packet_injection
    - wpa3_support
    - monitor_mode
    - hardware_crypto
