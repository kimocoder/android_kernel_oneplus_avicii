drivers:
  ath10k:
    android_compatible: true
    capabilities:
    - monitor_mode
    - packet_injection
    - mesh_networking
    - spectral_scan
    config_options:
      CONFIG_ATH10K: m
      CONFIG_ATH10K_DEBUG: y
      CONFIG_ATH10K_DEBUGFS: y
    conflicts:
    - ath11k
    - qcacld
    dependencies:
    - mac80211
    - cfg80211
    - crypto
    description: Qualcomm Atheros 11ac wireless driver
    family: ath10k
    kernel_module: ath10k_core
    max_kernel_version: null
    min_kernel_version: '3.10'
    name: ath10k
    supported_chipsets:
    - antenna_config: 3x3
      capabilities:
      - packet_injection
      - spectral_scan
      - mesh_networking
      - multi_antenna
      - monitor_mode
      firmware_files:
      - ath10k/QCA988X/hw2.0/firmware.bin
      firmware_required: true
      frequency_bands:
      - 2.4GHz
      - 5GHz
      interface: PCIe
      max_speed_mbps: 867
      model: QCA988X
      power_consumption_mw: null
      standards:
      - 802.11ac
      vendor: Qualcomm
    - antenna_config: 2x2
      capabilities:
      - mesh_networking
      - packet_injection
      - power_management
      - monitor_mode
      firmware_files:
      - ath10k/QCA6174/hw3.0/firmware.bin
      firmware_required: true
      frequency_bands:
      - 2.4GHz
      - 5GHz
      interface: PCIe
      max_speed_mbps: 867
      model: QCA6174
      power_consumption_mw: null
      standards:
      - 802.11ac
      vendor: Qualcomm
    vendor: Qualcomm
